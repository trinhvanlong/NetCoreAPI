name: Deploy .NET 10 MVC to MonsterASP

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:

      # 1. Lấy source code từ GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Cài .NET 10 SDK
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore
      - name: Restore
        run: dotnet restore DemoMVC/DemoMVC.csproj

      # 4. Build
      - name: Build
        run: dotnet build DemoMVC/DemoMVC.csproj -c Release --no-restore

      # 5. Publish
      - name: Publish
        run: dotnet publish DemoMVC/DemoMVC.csproj -c Release --output ./publish --runtime win-x86

      # 6. Deploy lên MonsterASP bằng WebDeploy
      - name: Deploy to MonsterASP
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}